name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          # Cache Gradle home so dependencies aren't re-downloaded on every run
          cache: gradle

      - name: Build fat JAR
        working-directory: KillBox
        run: ./gradlew fatJar

      # The fat JAR bundles natives for Windows, Linux, and macOS (all arches).
      # Run it with:
      #   Windows / Linux : java -jar KillBox.jar
      #   macOS           : java -XstartOnFirstThread -jar KillBox.jar
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: KillBox
          path: KillBox/build/libs/KillBox.jar
